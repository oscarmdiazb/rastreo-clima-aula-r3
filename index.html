const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(B.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryOpen(key){
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(B.nonce)},key,dec(B.ct));
 // Esperar a que el parser cierre el documento. Si se escribe mientras sigue abierto,
 // document.write INSERTA en la posición del parser en vez de reemplazar, y la puerta
 // queda pegada arriba (se veía al imprimir).
 if(document.readyState==='loading')
   await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
 document.open();document.write(new TextDecoder().decode(pt));document.close();}
async function go(){
 try{
  const key=await derive(document.getElementById('gpw').value);
  await tryOpen(key);
  const raw=await crypto.subtle.exportKey('raw',key);
  localStorage.setItem('arc_vol_k',btoa(String.fromCharCode(...new Uint8Array(raw))));
 }catch(e){document.getElementById('gerr').style.display='block'}}
document.getElementById('gbtn').onclick=go;
document.getElementById('gpw').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
(async()=>{const k=localStorage.getItem('arc_vol_k');if(!k)return;
 try{const key=await crypto.subtle.importKey('raw',dec(k),{name:'AES-GCM'},true,['decrypt']);
     await tryOpen(key);}catch(e){localStorage.removeItem('arc_vol_k')}})();
</script></body></html>
